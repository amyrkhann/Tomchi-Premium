<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomchi Premium</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

<section id="language-screen" class="screen active">

<h1>TOMCHI PREMIUM</h1>

<p>Тілді таңдаңыз / Выберите язык</p>

<button class="btn" onclick="setLanguage('kz')">
🇰🇿 Қазақша
</button>

<button class="btn" onclick="setLanguage('ru')">
🇷🇺 Русский
</button>

</section>

<section id="address-screen" class="screen">

<h2>Введите адрес доставки</h2>

<input
id="address"
type="text"
placeholder="Например: Абая 47">

<button class="btn" onclick="checkAddress()">
Проверить адрес
</button>
<div id="result"></div>
</section>

<section id="branch-screen" class="screen">

<h2>Выберите филиал</h2>

<div id="branches"></div>

</section>

<section id="menu-screen" class="screen">

    <button class="btn" onclick="backToBranches()">
        ← Назад
    </button>

    <h2 id="branch-title"></h2>

    <div id="menu-list"></div>

</section>


<section id="order-screen" class="screen">

    <button class="btn" onclick="backToMenu()">
        ← Вернуться в меню
    </button>

    <h2>Проверка заказа</h2>

    <div id="order-list"></div>

    <div id="order-total">
        Итого: <span id="order-total-price">0</span> ₸
    </div>

    <button class="btn" onclick="backToMenu()">
        ➕ Добавить ещё
    </button>

    <button class="btn" onclick="sendOrder()">
        Оформить заказ
    </button>

</section>

<div id="cart">

<button onclick="openOrderCheck()">
🛒 Проверить заказ
</button>

</div>

<a id="whatsapp"
href="#"
target="_blank">
WhatsApp
</a>
</div>
<div id="deliveryModal" class="modal">

  <div class="modal-content">

    <h2 id="modalTitle"></h2>

    <p id="modalText"></p>

    <button class="btn" onclick="continueOrder()">
      Продолжить
    </button>

    <button class="btn cancel" onclick="closeModal()">
      Изменить адрес
    </button>

  </div>

</div>
<script src="app.js"></script>

</body>
</html>
