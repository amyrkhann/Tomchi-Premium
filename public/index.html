<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomchi Premium</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

<section id="language-screen" class="screen active">

<h1>TOMCHI PREMIUM</h1>

<p>Тілді таңдаңыз / Выберите язык</p>

<button class="btn" type="button" onclick="setLanguage('kz')">
    🇰🇿 Қазақша
</button>

<button class="btn" type="button" onclick="setLanguage('ru')">
    🇷🇺 Русский
</button>

</section>

<section id="address-screen" class="screen">

<h2>Введите адрес доставки</h2>

<input
id="address"
type="text"
placeholder="Например: Абая 47">

<button class="btn" onclick="checkAddress()">
Проверить адрес
</button>
<div id="result"></div>
</section>

<section id="branch-screen" class="screen">

<h2>Выберите филиал</h2>

<div id="branches"></div>

</section>

<section id="menu-screen" class="screen">

    <button class="btn" onclick="backToBranches()">
        ← Назад
    </button>

    <h2 id="branch-title"></h2>

    <div id="menu-list"></div>

</section>


<section id="order-screen" class="screen">

    <button class="btn" onclick="backToMenu()">
        ← Вернуться в меню
    </button>

    <h2>Проверка заказа</h2>

    <div id="order-list"></div>

    <div id="order-total">
        Итого: <span id="order-total-price">0</span> ₸
    </div>

    <button class="btn" onclick="backToMenu()">
        ➕ Добавить ещё
    </button>

<button class="btn" onclick="showKaspiPayment()">
    💳 Оплатить через Kaspi
</button>
<div id="customer-form" style="display:none;">
<!-- KASPI ОПЛАТА -->
<div id="kaspi-payment" style="display:none;">

    <h2>💳 Оплата Kaspi</h2>

    <p>Переведите сумму заказа на Kaspi:</p>

    <div class="kaspi-box">
        <h3 id="kaspi-name"></h3>
        <p id="kaspi-phone"></p>
        <p>
            Сумма:
            <strong><span id="kaspi-amount">0</span> ₸</strong>
        </p>
    </div>

    <button
        class="btn"
        type="button"
        onclick="copyKaspiNumber()">
        📋 Скопировать номер
    </button>

    <button
        class="btn"
        type="button"
        onclick="showCustomerForm()">
        ✅ Я оплатил
    </button>

</div>
    <h2>Оформление заказа</h2>

    <input
        id="customer-name"
        type="text"
        placeholder="Ваше имя"
    >

    <input
        id="customer-phone"
        type="tel"
        placeholder="Номер телефона"
    >

    <textarea
        id="customer-comment"
        placeholder="Комментарий к заказу"
        style="width:100%; min-height:90px; padding:15px; font-size:17px; border:1px solid #ccc; border-radius:10px; margin-bottom:15px; font-family:Arial,sans-serif;"
    ></textarea>

    <button class="btn" type="button" onclick="sendOrder()">
        📲 Отправить заказ
    </button>

</div>
</section>

<div id="cart">

<button onclick="openOrderCheck()">
🛒 Проверить заказ
</button>

</div>

<a id="whatsapp"
href="#"
target="_blank">
WhatsApp
</a>
</div>
<div id="deliveryModal" class="modal">

  <div class="modal-content">

    <h2 id="modalTitle"></h2>

    <p id="modalText"></p>

    <button class="btn" onclick="continueOrder()">
      Продолжить
    </button>

    <button class="btn cancel" onclick="closeModal()">
      Изменить адрес
    </button>

  </div>

</div>
<script src="app.js"></script>

</body>
</html>
