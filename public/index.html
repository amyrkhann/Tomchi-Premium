
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#916718">
  <title>Tomchi Premium</title>
  <link rel="stylesheet" href="style.css">

  <style>
    #app {
      min-height: 100vh;
      background: #f8f3e9;
      color: #29251f;
      font-family: Arial, sans-serif;
    }

    .simple-wrap {
      max-width: 1000px;
      margin: auto;
      padding: 24px 16px 100px;
    }

    .simple-card {
      max-width: 520px;
      margin: 30px auto;
      padding: 25px 20px;
      background: white;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 8px 30px #0000000c;
    }

    .simple-logo {
      color: #916718;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .simple-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      margin-top: 12px;
      background: #916718;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .simple-input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ded7cb;
      border-radius: 12px;
      font-size: 16px;
    }

    .zone-image {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      margin: 20px auto;
      border-radius: 15px;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .food-card {
      padding: 15px;
      background: white;
      border-radius: 15px;
    }

    .food-card h3 {
      margin-top: 0;
    }

    .food-price {
      color: #916718;
      font-weight: bold;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .quantity-row button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: #f3ead9;
      color: #795712;
      font-size: 22px;
    }

    .category-title {
      margin-top: 28px;
    }

    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
    }

    .category-bar button {
      flex-shrink: 0;
      padding: 9px 13px;
      border: 1px solid #d7c49e;
      border-radius: 25px;
      background: white;
      color: #795712;
    }

    .cart-fixed {
      position: fixed;
      z-index: 1000;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-width: 700px;
      margin: auto;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: #916718;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .cart-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee6d9;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      padding: 18px 0;
      font-size: 20px;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .food-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .food-card {
        padding: 11px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="app.js"></script>
</body>
</html>
